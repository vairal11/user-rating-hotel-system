server.port=9095

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/User_Service_1
spring.datasource.username=YOUR_USERNAME
spring.datasource.password=YOUR_PASSWORD

spring.application.name=USER-SERVICE

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

resilience4j.circuitbreaker.instances.RatingHotelBreaker.register-health-indicator= true
resilience4j.circuitbreaker.instances.RatingHotelBreaker.sliding-window-size= 10
resilience4j.circuitbreaker.instances.RatingHotelBreaker.sliding-window-type= COUNT_BASED
resilience4j.circuitbreaker.instances.RatingHotelBreaker.permitted-number-of-calls-in-half-open-state= 4
resilience4j.circuitbreaker.instances.RatingHotelBreaker.minimum-number-of-calls= 10
resilience4j.circuitbreaker.instances.RatingHotelBreaker.wait-duration-in-open-state= 5s
resilience4j.circuitbreaker.instances.RatingHotelBreaker.slow-call-rate-threshold= 50
resilience4j.circuitbreaker.instances.RatingHotelBreaker.slow-call-duration-threshold= 10
resilience4j.circuitbreaker.instances.RatingHotelBreaker.failure-rate-threshold= 50
